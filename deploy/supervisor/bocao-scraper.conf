[program:bocao-scraper]
directory=/var/www/html/bocao-bot/scraper
command=/usr/bin/env HOME=/var/www COREPACK_HOME=/var/www/.cache/corepack PLAYWRIGHT_BROWSERS_PATH=/var/www/.cache/ms-playwright /usr/bin/pnpm run start
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/var/www/html/bocao-bot/laravel/storage/logs/scraper-supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
environment=NODE_ENV="production"
