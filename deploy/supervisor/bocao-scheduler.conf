[program:bocao-scheduler]
directory=/var/www/html/bocao-bot/laravel
command=/usr/bin/php artisan schedule:work
user=www-data
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=/var/www/html/bocao-bot/laravel/storage/logs/scheduler-supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
environment=APP_ENV="production"
